name: Build and Deploy

on:
  # Pushes to main build AND deploy.
  push:
    branches: [main]
  # Pull requests only build, so a broken PR is caught without
  # publishing it to the live site.
  pull_request:
    branches: [main]

# Never let two deploys race; let a newer push cancel an in-flight PR build.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      # Tells GitHub Pages not to run the output through Jekyll.
      - run: touch dist/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    # Only ever runs for pushes to main, never for pull requests.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
