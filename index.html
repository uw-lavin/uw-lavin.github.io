<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Square icons. The full wordmark is 2230x812, so pointing the favicon at it
         got it squashed into the square icon slot. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Lavin Entrepreneurship Program at UW - Building the next generation of entrepreneurs" />
    <title>Lavin</title>
    
    <!-- Encode Sans (the Lavin logo typeface) + Open Sans are served by Google Fonts
         and imported in src/index.css; warm up the connection early. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


    <!-- Open Graph Tags for Social Media -->
    <meta property="og:title" content="Lavin Entrepreneurship Program" />
    <meta property="og:description" content="Building the next generation of entrepreneurs at UW Seattle" />
    <!-- og:image must be an absolute URL — scrapers do not resolve relative paths.
         Served from public/ so the filename stays stable across builds. -->
    <meta property="og:image" content="https://uwlavin.com/og-image.png" />
    <meta property="og:image:width" content="2230" />
    <meta property="og:image:height" content="812" />
    <meta property="og:image:alt" content="Lavin Entrepreneurship Program Logo" />
    <meta property="og:url" content="https://uwlavin.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lavin" />
    <meta property="og:locale" content="en_US" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
