# Pages CMS configuration: the site admin at https://app.pagescms.org
# Docs: https://pagescms.org/docs/
#
# Scope: Events only. Leadership and Memories are maintained by hand in
# src/content/ -- see the README.
#
# IMPORTANT: when an editor saves, Pages CMS rewrites the file from the fields
# declared here and DROPS anything else. Every key the site reads must be
# declared below, or it disappears on the first save.

settings:
  commit:
    # Record the editor's own name on each change, not Pages CMS's.
    identity: user

components:
  # Times are dropdowns so they can't be mistyped. Shown as "5:00 PM", saved
  # as "17:00". Quoted on purpose: YAML reads a bare 17:00 as a number.
  time:
    type: select
    required: true
    options:
      placeholder: Pick a time
      values:
        - { name: "07:00", label: "7:00 AM" }
        - { name: "07:15", label: "7:15 AM" }
