content:
  - name: events
    label: Events
    type: collection
    path: src/content/events
    format: json
    filename: "{fields.date}-{fields.title}.json"
    view:
      primary: title
      fields: [title, date, start]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 80
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: start
        label: Starts
        component: time
        description: When it actually starts, not when the room is booked.
      - name: end
        label: Ends
        component: time
      - name: location
        label: Location
        type: select
        required: true
        description: The building and a campus-map link are added automatically.
        options:
          placeholder: Pick a room
          values:
            # rooms:start (must match ROOMS in src/lib/locations.js; the build checks)
            - { name: "Hogan Terrace", label: "Hogan Terrace (PACCAR Hall)" }
            - { name: "Deloitte Commons", label: "Deloitte Commons (PACCAR Hall)" }
            - { name: "Shansby Auditorium", label: "Shansby Auditorium (PACCAR Hall)" }
            - { name: "Garvey Family Atrium", label: "Garvey Family Atrium (PACCAR Hall)" }
            - { name: "Jiambalvo Hearth", label: "Jiambalvo Hearth (PACCAR Hall)" }
            - { name: "Orin's Cafe", label: "Orin's Cafe (PACCAR Hall)" }
            - { name: "Dempsey Gallery", label: "Dempsey Gallery (PACCAR Hall)" }
            - { name: "Peek Forum", label: "Peek Forum (Founders Hall)" }
            - { name: "Founders Gallery", label: "Founders Gallery (Founders Hall)" }
            # rooms:end
            - { name: "Other", label: "Somewhere else (type it below)" }
      - name: otherLocation
        label: Somewhere else
        type: string
        description: Only if you picked "Somewhere else" above. Shown exactly as typed, with no map link.
      - name: desc
        label: Description
        type: text
        required: true
        options:
          maxlength: 400
