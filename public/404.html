<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lavin</title>
    <script>
      // The app uses HashRouter, so every real route lives under "/#/...".
      // GitHub Pages serves this file for any other path; send those to the
      // homepage rather than showing a 404.
      window.location.replace(window.location.origin + '/#/');
    </script>
    <meta http-equiv="refresh" content="0; url=/#/" />
  </head>
  <body>
    <p>Redirecting to <a href="/#/">uwlavin.com</a>&hellip;</p>
  </body>
</html>
